name: Windows build / portable / setup

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.0"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build Windows desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore src/RW3ProNativeDSHaptics/RW3ProNativeDSHaptics.csproj
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet run --project tests/RW3Pro.ContractTests/RW3Pro.ContractTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Contract tests failed" }
          dotnet build src/RW3ProNativeDSHaptics/RW3ProNativeDSHaptics.csproj -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "Windows WPF build failed" }
          dotnet publish src/RW3ProNativeDSHaptics/RW3ProNativeDSHaptics.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.version.outputs.version }} -o publish
          if ($LASTEXITCODE -ne 0) { throw "Windows publish failed" }
          if (-not (Test-Path publish/RW3ProNativeDSHaptics.exe)) { throw "Published executable missing" }
      - name: Smoke test packaged application without hardware
        shell: pwsh
        run: |
          # WinExe is a GUI subsystem process: PowerShell's call operator need not wait.
          # Start-Process -Wait gives a reliable exit code even on a headless runner.
          $exe = (Resolve-Path publish/RW3ProNativeDSHaptics.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          Write-Host "Published executable self-test exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Published executable self-test failed: $($process.ExitCode)" }
      - name: Prepare portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable, dist | Out-Null
          Copy-Item -Path publish\* -Destination portable\ -Recurse -Force
          New-Item -ItemType File -Path portable\portable.flag -Force | Out-Null
          Compress-Archive -Path portable\* -DestinationPath dist\RW3ProNativeDSHaptics-Portable-win-x64.zip -CompressionLevel Optimal
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler unavailable" }
      - name: Create Windows installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $publish = (Resolve-Path publish).Path
          & $compiler "/DAppVersion=${{ steps.version.outputs.version }}" "/DPublishDir=$publish" "installer\app.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }
      - name: Test portable ZIP and user-scoped installer without hardware
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:RUNNER_TEMP 'rw3-portable-smoke'
          Expand-Archive -Path dist/RW3ProNativeDSHaptics-Portable-win-x64.zip -DestinationPath $portable -Force
          if (-not (Test-Path (Join-Path $portable 'portable.flag'))) { throw "Portable marker missing" }
          $portableExe = Join-Path $portable 'RW3ProNativeDSHaptics.exe'
          if (-not (Test-Path $portableExe)) { throw "Portable executable missing" }
          $process = Start-Process -FilePath $portableExe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Portable ZIP self-test failed: $($process.ExitCode)" }

          $setup = (Resolve-Path dist/RW3ProNativeDSHaptics-Setup-win-x64.exe).Path
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer smoke installation failed: $($process.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/RW3ProNativeDSHaptics'
          $installedExe = Join-Path $installed 'RW3ProNativeDSHaptics.exe'
          $uninstaller = Join-Path $installed 'unins000.exe'
          if (-not (Test-Path $installedExe) -or -not (Test-Path $uninstaller)) { throw "Installed files missing" }
          $process = Start-Process -FilePath $installedExe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed app self-test failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall smoke failed: $($process.ExitCode)" }
          if (Test-Path $installedExe) { throw "Uninstall did not remove application executable" }
      - name: Generate SHA256 manifests
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -NoNewline -Encoding ascii
          }
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: RW3ProNativeDSHaptics-win-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
